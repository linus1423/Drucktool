# Lokaler Betrieb und Betrieb auf einem Server mit Docker Compose oder Podman Compose (siehe README, "Betrieb mit
# Docker Compose oder Podman"). Mit Ansible ausgerollte Server nutzen ansible/roles/drucktool/templates/docker-compose.yml.j2.
services:
  db:
    image: postgres:16-alpine
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped
    environment:
      POSTGRES_DB: drucktool
      POSTGRES_USER: drucktool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drucktool}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drucktool -d drucktool']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Auf dem Server das veröffentlichte Image, z. B. APP_IMAGE=ghcr.io/linus1423/drucktool:v1.2.0 in der .env.
    image: ${APP_IMAGE:-drucktool:local}
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Nur Startreihenfolge, nicht auf "healthy" warten: der erste Download der Signaturen dauert einige Minuten.
      # Bis clamd bereit ist, lehnt die App Uploads mit einem Hinweis ab ("in ein paar Minuten erneut versuchen").
      # required: false, damit "--scale clamav=0" (Prüfung abgeschaltet) die App nicht blockiert.
      clamav:
        condition: service_started
        required: false
    # Alle übrigen Einstellungen (OIDC_*, CUSTOMER_*, ATTACHMENT_* …) kommen aus der .env, wie auf dem Server (Issue #160).
    # Die Einträge unter environment haben Vorrang, damit die für "pnpm dev" gedachten Werte der .env
    # (DATABASE_URL mit localhost, UPLOAD_DIR) im Container nicht greifen.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://drucktool:${POSTGRES_PASSWORD:-drucktool}@db:5432/drucktool
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-500}
      UPLOAD_PENDING_MAX_MB: ${UPLOAD_PENDING_MAX_MB:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      IMPRINT_URL: ${IMPRINT_URL:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      UPLOAD_DIR: /app/uploads
      # Uploads werden vom clamav-Container geprüft. CLAMAV_HOST= (leer, z. B. in .env) schaltet die Prüfung ab.
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LEXWARE_ARTICLE_NUMBER: ${LEXWARE_ARTICLE_NUMBER:-DRUCK}
      LEXWARE_TAX_RATE: ${LEXWARE_TAX_RATE:-19}
    volumes:
      - uploads:/app/uploads
    ports:
      # Hinter Caddy oder einem anderen Reverse Proxy APP_PORT=127.0.0.1:3000 setzen, sonst ist die App ohne HTTPS
      # von außen erreichbar (Docker umgeht die Firewall).
      - '${APP_PORT:-3000}:3000'

  # Verschickt E-Mails aus der Outbox. Startet nach der App, damit die Migrationen gelaufen sind.
  worker:
    image: ${APP_IMAGE:-drucktool:local}
    command: worker
    logging: *logging
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://drucktool:${POSTGRES_PASSWORD:-drucktool}@db:5432/drucktool
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Drucktool <noreply@localhost>}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      SESSION_IP_RETENTION_DAYS: ${SESSION_IP_RETENTION_DAYS:-30}
      REJECTED_REGISTRATION_RETENTION_DAYS: ${REJECTED_REGISTRATION_RETENTION_DAYS:-30}
      REQUEST_FILE_RETENTION_DAYS: ${REQUEST_FILE_RETENTION_DAYS:-90}
      UNSUBMITTED_UPLOAD_RETENTION_DAYS: ${UNSUBMITTED_UPLOAD_RETENTION_DAYS:-1}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      UPLOAD_DIR: /app/uploads
    # Der Aufräumjob löscht Dateien nach Ablauf der Löschfristen (Issue #172) und braucht dafür die Ablage.
    volumes:
      - uploads:/app/uploads
    healthcheck:
      disable: true

  # Virenscanner für Uploads (Issue #99, #120). Lädt beim ersten Start die Signaturen, das dauert einige Minuten;
  # danach hält freshclam sie im Container selbst aktuell. Braucht etwa 1,5 GB RAM.
  clamav:
    image: clamav/clamav:stable
    logging: *logging
    restart: unless-stopped
    environment:
      # Ohne diese Grenzen prüft clamd nur die ersten 25 MB bzw. lässt große Dateien ungeprüft durch.
      CLAMD_CONF_StreamMaxLength: ${UPLOAD_MAX_MB:-500}M
      CLAMD_CONF_MaxFileSize: ${UPLOAD_MAX_MB:-500}M
      CLAMD_CONF_MaxScanSize: ${UPLOAD_MAX_MB:-500}M
    volumes:
      # Signaturen bleiben über Neustarts erhalten, sonst lädt jeder Start sie neu herunter.
      - clamav-db:/var/lib/clamav
    healthcheck:
      # clamdcheck.sh liegt im Image und fragt clamd per PING ab.
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  # HTTPS mit automatischem Let's-Encrypt-Zertifikat, nur mit Profil "https" (COMPOSE_PROFILES=https in der .env).
  # Braucht DOMAIN in der .env und die Ports 80 und 443.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    logging: *logging
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  clamav-db:
  caddy-data:
  caddy-config:
