# Lokaler Betrieb und Vorlage für den Server. Produktiv wird über Ansible ausgerollt.
services:
  db:
    image: postgres:16-alpine
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped
    environment:
      POSTGRES_DB: drucktool
      POSTGRES_USER: drucktool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drucktool}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drucktool -d drucktool']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: drucktool:local
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Nur Startreihenfolge, nicht auf "healthy" warten: der erste Download der Signaturen dauert einige Minuten.
      # Bis clamd bereit ist, lehnt die App Uploads mit einem Hinweis ab ("in ein paar Minuten erneut versuchen").
      # required: false, damit "--scale clamav=0" (Prüfung abgeschaltet) die App nicht blockiert.
      clamav:
        condition: service_started
        required: false
    environment:
      DATABASE_URL: postgres://drucktool:${POSTGRES_PASSWORD:-drucktool}@db:5432/drucktool
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-500}
      UPLOAD_PENDING_MAX_MB: ${UPLOAD_PENDING_MAX_MB:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      IMPRINT_URL: ${IMPRINT_URL:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      # Uploads werden vom clamav-Container geprüft. CLAMAV_HOST= (leer, z. B. in .env) schaltet die Prüfung ab.
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LEXWARE_ARTICLE_NUMBER: ${LEXWARE_ARTICLE_NUMBER:-DRUCK}
      LEXWARE_TAX_RATE: ${LEXWARE_TAX_RATE:-19}
    volumes:
      - uploads:/app/uploads
    ports:
      - '${APP_PORT:-3000}:3000'

  # Verschickt E-Mails aus der Outbox. Startet nach der App, damit die Migrationen gelaufen sind.
  worker:
    image: drucktool:local
    command: worker
    logging: *logging
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://drucktool:${POSTGRES_PASSWORD:-drucktool}@db:5432/drucktool
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Drucktool <noreply@localhost>}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      SESSION_IP_RETENTION_DAYS: ${SESSION_IP_RETENTION_DAYS:-30}
      REJECTED_REGISTRATION_RETENTION_DAYS: ${REJECTED_REGISTRATION_RETENTION_DAYS:-30}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
    healthcheck:
      disable: true

  # Virenscanner für Uploads (Issue #99, #120). Lädt beim ersten Start die Signaturen, das dauert einige Minuten;
  # danach hält freshclam sie im Container selbst aktuell. Braucht etwa 1,5 GB RAM.
  clamav:
    image: clamav/clamav:stable
    logging: *logging
    restart: unless-stopped
    environment:
      # Ohne diese Grenzen prüft clamd nur die ersten 25 MB bzw. lässt große Dateien ungeprüft durch.
      CLAMD_CONF_StreamMaxLength: ${UPLOAD_MAX_MB:-500}M
      CLAMD_CONF_MaxFileSize: ${UPLOAD_MAX_MB:-500}M
      CLAMD_CONF_MaxScanSize: ${UPLOAD_MAX_MB:-500}M
    volumes:
      # Signaturen bleiben über Neustarts erhalten, sonst lädt jeder Start sie neu herunter.
      - clamav-db:/var/lib/clamav
    healthcheck:
      # clamdcheck.sh liegt im Image und fragt clamd per PING ab.
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  db-data:
  uploads:
  clamav-db:
