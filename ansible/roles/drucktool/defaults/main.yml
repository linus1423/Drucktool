drucktool_dir: /opt/drucktool
drucktool_backup_dir: /var/backups/drucktool
drucktool_backup_keep_days: 14
drucktool_upload_max_mb: 500
drucktool_attachment_max_mb: 25
# Audit-Log: Einträge nach so vielen Tagen löschen (0 = nie)
drucktool_audit_log_retention_days: 365
# Löschfristen in Tagen (0 = nie): IP-Adressen an Sitzungen, abgelehnte Registrierungen
drucktool_session_ip_retention_days: 30
drucktool_rejected_registration_retention_days: 30
# Links auf Datenschutzerklärung und Impressum in der Fußzeile (leer = ausblenden)
drucktool_privacy_url: ''
drucktool_imprint_url: ''
drucktool_registry_username: ''
drucktool_registry_password: ''
drucktool_customer_email_domains: []
drucktool_smtp_url: ''
drucktool_mail_from: 'Drucktool <noreply@localhost>'
drucktool_oidc_issuer: ''
drucktool_oidc_client_id: ''
drucktool_oidc_client_secret: ''
drucktool_oidc_display_name: 'Firmenkonto'
drucktool_oidc_new_users: pending
drucktool_oidc_trust_email: false
drucktool_oidc_role_claim: roles
drucktool_oidc_admin_roles: []
drucktool_oidc_staff_roles: []
drucktool_oidc_enforce_for_staff: false
