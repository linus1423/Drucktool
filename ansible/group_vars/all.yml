# Öffentliche Einstellungen. Geheimnisse gehören in group_vars/vault.yml (ansible-vault).

# Image aus der GitHub Container Registry (wird von der CI gebaut).
drucktool_image: ghcr.io/linus1423/drucktool
drucktool_image_tag: latest

# Domain für HTTPS über Caddy (Let's Encrypt). Leer lassen, um nur Port 3000 freizugeben.
drucktool_domain: ''
drucktool_acme_email: ''

drucktool_superadmin_email: ''

# Neue Kundenkonten per Anmeldelink nur für diese Domains, z. B. ['tum.de']. Leer = alle.
drucktool_customer_email_domains: []

# Absender für E-Mail-Benachrichtigungen. Die SMTP-Zugangsdaten stehen im Vault.
drucktool_mail_from: 'Drucktool <noreply@example.com>'

# Anmeldung über OpenID Connect. Leer lassen, um sie abzuschalten.
# Beim Anbieter als Redirect-URI eintragen: https://<drucktool_domain>/api/auth/oidc/callback
drucktool_oidc_issuer: ''
drucktool_oidc_client_id: ''
drucktool_oidc_display_name: 'Firmenkonto'
# pending: unbekannte Benutzer warten auf Freigabe, staff: werden Mitarbeiter, reject: abweisen
drucktool_oidc_new_users: pending
# true bei Anbietern ohne email_verified-Claim, deren Adressen vertrauenswürdig sind (z. B. Entra ID)
drucktool_oidc_trust_email: false
# Rollen vom Anbieter übernehmen, z. B. Entra-App-Rollen: ['Drucktool.Admin'] / ['Drucktool.Mitarbeiter']
drucktool_oidc_role_claim: roles
drucktool_oidc_admin_roles: []
drucktool_oidc_staff_roles: []
# true: Mitarbeiter und Admins melden sich nur noch über den Anbieter an
drucktool_oidc_enforce_for_staff: false
