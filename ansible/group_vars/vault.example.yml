# Je Umgebung kopieren und verschlüsseln (eigene Passwörter je Umgebung!):
#   cp group_vars/vault.example.yml vault/production.yml && ansible-vault encrypt vault/production.yml
#   cp group_vars/vault.example.yml vault/staging.yml    && ansible-vault encrypt vault/staging.yml
# z. B. mit: openssl rand -hex 24
# Das Playbook bricht ab, solange hier noch die Beispielwerte stehen.
drucktool_postgres_password: 'bitte-ein-langes-zufaelliges-passwort'
drucktool_superadmin_password: 'bitte-aendern-mindestens-12-zeichen'
# Nur nötig, wenn das Image in einer privaten Registry liegt.
drucktool_registry_username: ''
drucktool_registry_password: ''
# SMTP-Server für E-Mail-Benachrichtigungen, z. B. smtps://benutzer:passwort@mail.example.com:465
# Leer lassen, um keine Mails zu verschicken (sie werden dann nur protokolliert).
drucktool_smtp_url: ''
# Client-Secret für OpenID Connect (nur nötig, wenn drucktool_oidc_issuer gesetzt ist).
drucktool_oidc_client_secret: ''
drucktool_customer_oidc_client_secret: ''
# Offsite-Backup mit restic (nur nötig, wenn drucktool_offsite_backup_enabled: true; mind. 16 Zeichen). Das Passwort
# verschlüsselt die Backups; ohne es sind sie wertlos. Deshalb zusätzlich außerhalb des Servers aufbewahren.
drucktool_restic_password: ''
# Zugangsdaten für das Ziel, z. B. für S3:
drucktool_restic_env: {}
#   AWS_ACCESS_KEY_ID: '…'
#   AWS_SECRET_ACCESS_KEY: '…'
