- name: Drucktool ausrollen
  hosts: all
  become: true
  vars_files:
    # Je Umgebung ein eigener Vault; group_vars/vault.yml bleibt als Rückfall für bestehende Installationen.
    - ["vault/{{ drucktool_environment }}.yml", "group_vars/vault.yml"]
  roles:
    - docker
    - drucktool
    - drucktool_monitor
