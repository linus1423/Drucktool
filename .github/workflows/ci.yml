name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint und Formatierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  check:
    name: Typecheck, Tests, Migrationen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drucktool
          POSTGRES_PASSWORD: drucktool
          POSTGRES_DB: drucktool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drucktool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://drucktool:drucktool@localhost:5432/drucktool_test
    steps:
      - uses: actions/checkout@v7
        with:
          # Für den Migrationstest gegen den Stand vor dieser Änderung.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Keine ungenerierten Schemaänderungen
        run: |
          pnpm exec drizzle-kit check
          timeout 120 pnpm exec drizzle-kit generate --name ci-pruefung < /dev/null
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo '::error::src/server/db/schema.ts enthält Änderungen ohne Migration. Bitte "pnpm db:generate --name <name>" ausführen und die Dateien einchecken.'
            exit 1
          fi
      - name: Migrationen auf dem bisherigen Schema einspielen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DATABASE_URL: postgres://drucktool:drucktool@localhost:5432/drucktool_upgrade
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Kein vorheriger Stand vorhanden, Test entfällt.'
            exit 0
          fi
          psql postgres://drucktool:drucktool@localhost:5432/drucktool_test -c 'create database drucktool_upgrade'
          mkdir -p /tmp/vorher
          git archive "$BASE_SHA" drizzle | tar -x -C /tmp/vorher
          echo "Schema von ${BASE_SHA} anlegen …"
          MIGRATIONS_DIR=/tmp/vorher/drizzle pnpm db:migrate
          echo 'Neue Migrationen darauf einspielen …'
          pnpm db:migrate

  e2e:
    name: E2E und Barrierefreiheit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drucktool
          POSTGRES_PASSWORD: drucktool
          POSTGRES_DB: drucktool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drucktool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://drucktool:drucktool@localhost:5432/drucktool
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_PASSWORD: e2e-passwort-1234
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  ansible:
    name: Ansible prüfen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'ansible-core>=2.17,<2.20' ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint
      - run: ansible-playbook -i inventory.example.yml --syntax-check playbook.yml

  smoke:
    name: Docker-Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: drucktool:local
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starten, Healthcheck und Anmeldung prüfen
        run: scripts/smoke/smoke-test.sh

  # Veröffentlicht das Image nur, wenn alle Prüfungen grün sind.
  image:
    name: Docker-Image veröffentlichen
    if: github.event_name == 'push'
    needs: [lint, check, e2e, ansible, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Image für den Sicherheitsscan bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: drucktool:scan
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Auf kritische Sicherheitslücken prüfen
        # Auf Commit festgelegt (v0.35.0): Versions-Tags dieser Action wurden im März 2026 kompromittiert.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.69.3
          image-ref: drucktool:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/drucktool
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
