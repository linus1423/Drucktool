# Schaltet für Patch-Updates von Dependabot "Automatisch mergen" ein. GitHub merged dann erst, wenn die
# Pflicht-Checks (Branch-Schutz) grün sind. Standardmäßig aus: Repository-Variable DEPENDABOT_AUTOMERGE=true setzen,
# "Allow auto-merge" in den Einstellungen aktivieren und für main einen Branch-Schutz mit Pflicht-Checks anlegen.
name: Dependabot automatisch mergen

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && vars.DEPENDABOT_AUTOMERGE == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
