name: Sicherheit

# Sicherheitsprüfungen getrennt von der normalen CI. Läuft bei jedem Pull Request, auf main und zusätzlich jeden
# Montag, damit neu bekannt gewordene Lücken in Abhängigkeiten oder im Basis-Image auffallen, auch wenn sich am Code
# nichts ändert. Schlägt der geplante Lauf fehl, schickt GitHub dem Repository-Inhaber eine Mail.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Abhängigkeiten (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # pnpm audit liest nur die Lockfile, eine Installation ist nicht nötig.
      - name: Laufzeit-Abhängigkeiten ohne bekannte Lücken
        run: pnpm audit --prod
      - name: Entwicklungswerkzeuge ohne hohe oder kritische Lücken
        run: pnpm audit --audit-level high

  secrets:
    name: Zugangsdaten im Repository (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die ganze Historie: ein einmal eingechecktes Passwort bleibt dort, auch wenn es später gelöscht wurde.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks installieren (Prüfsumme fest hinterlegt)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      # Ausnahmen für Testpasswörter stehen in .gitleaks.toml.
      - name: Historie und Arbeitsstand durchsuchen
        run: |
          /tmp/gitleaks git --redact --verbose .
          /tmp/gitleaks dir --redact --verbose .

  workflows:
    name: GitHub-Workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install 'zizmor==1.30.1'
      # Findet u. a. nicht auf Commits festgelegte Actions, Skript-Injection über ${{ }} und zu weite Rechte.
      # Ausnahmen stehen in .github/zizmor.yml.
      - name: Workflows prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows

  codeql:
    name: Code-Analyse (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          # Erweiterte Sicherheitsregeln (Injection, Pfade, Redirects, Kryptografie …).
          queries: security-extended
      # Befunde erscheinen unter "Security > Code scanning" und als Anmerkungen im Pull Request.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:javascript-typescript'

  image:
    name: Docker-Image und Konfiguration (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: drucktool:security
          # Nur lesen: dieser Job schreibt nichts in den Cache.
          cache-from: type=gha
      # Die Veröffentlichung in ci.yml bricht nur bei kritischen Lücken ab; hier zählen auch hohe.
      - name: Image auf hohe und kritische Lücken prüfen
        # Auf Commit festgelegt (v0.35.0): Versions-Tags dieser Action wurden im März 2026 kompromittiert.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.69.3
          image-ref: drucktool:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Dockerfile und Compose-Dateien auf Fehlkonfiguration prüfen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
