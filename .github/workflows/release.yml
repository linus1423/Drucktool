name: Release

# Ein Tag v* (z. B. v1.2.0) legt ein GitHub-Release mit automatisch erzeugten Release Notes an (Changelog aus den
# gemergten Pull Requests, gruppiert nach Labels, siehe .github/release.yml). Das Image baut die CI (ci.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release anlegen
    runs-on: ubuntu-latest
    steps:
      - name: Release mit Changelog anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
